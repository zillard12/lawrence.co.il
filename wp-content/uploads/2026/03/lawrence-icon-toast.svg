    <circle cx="206" cy="222" r="3" fill="#5A1D2B" stroke="none"/>
    <circle cx="404" cy="315" r="4" fill="#5A1D2B" stroke="none"/>
    <circle cx="416" cy="298" r="3" fill="#5A1D2B" stroke="none"/>
